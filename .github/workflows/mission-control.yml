name: Fourdock WhatsApp candidate
on:
  push:
    branches: [main]
    paths: ['clients/mission-control/**', 'scripts/test-mission-ui.mjs', '.github/workflows/mission-control.yml']
  pull_request:
    paths: ['clients/mission-control/**', 'scripts/test-mission-ui.mjs', '.github/workflows/mission-control.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mission-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: clients/mission-control/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix clients/mission-control
      - run: npm run build --prefix clients/mission-control
      - run: npm test --prefix clients/mission-control
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run node scripts/test-mission-ui.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Fourdock-WhatsApp-synthetic-evidence
          path: dist/mission-control-*
          if-no-files-found: error
